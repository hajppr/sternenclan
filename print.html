<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Druckvorlagen SternenClan</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <style>
    :root {
      --night: #121c18;
      --forest: #1f3a2f;
      --gold: #d4a64a;
      --gold-ink: #8a6418;
      --ink: #2a2116;
      --paper: #fbf6e8;
      --line: #d8c9a3;
      --title: "Cinzel", "Trajan Pro", Georgia, serif;
      --body: "EB Garamond", "Palatino Linotype", Palatino, Georgia, serif;
    }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { margin: 0; padding: 16px; font-family: var(--body); color: var(--ink); background: #fff; font-size: 11pt; }

    .screen-only { background: #fff6dc; border: 1px solid var(--line); padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-family: sans-serif; font-size: 0.95rem; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .screen-only code { background: #fff; padding: 1px 4px; }
    .screen-only label { white-space: nowrap; font-weight: 600; cursor: pointer; }

    section { break-after: page; page-break-after: always; }
    section:last-child { break-after: auto; page-break-after: auto; }
    section > h2 .pdf { margin-left: 8px; font: 600 0.8rem sans-serif; padding: 3px 10px; cursor: pointer; border: 1px solid var(--forest); border-radius: 6px; background: #fff; color: var(--forest); }
    body[data-only] section:not(.only) { display: none; }
    .grid { break-inside: avoid; }
    /* Rollenkarten: 2 nebeneinander (Druck: Querformat, 2 × 2 pro Seite) */
    .grid.two { grid-template-columns: repeat(2, 1fr); gap: 5mm 8mm; }
    .grid.two .card { height: 88mm; }
    .grid.two .band { padding: 2.5mm 3mm 3mm; }
    .grid.two .band .caps { font-size: 0.85rem; }
    .grid.two .eyes { width: 30%; margin-top: 1.5mm; }
    .grid.two .card .body { display: flex; flex-direction: column; justify-content: center; padding: 3mm 6mm 5mm; }
    .grid.two .card .forest { height: 7mm; }
    /* Name so groß wie möglich, lange Namen werden passend kleiner (--len = Anzahl Buchstaben) */
    .grid.two .card .body { container-type: inline-size; }
    .grid.two .apprentice { font-size: min(2.7rem, calc(100cqw / (var(--len, 11) * 0.84))); line-height: 1.05; margin: 0; white-space: nowrap; }
    .grid.two .role-title { margin: 1.5mm 0 2.5mm; font-size: 0.95rem; letter-spacing: 0.2em; }
    .grid.two .role-text { font-size: 1.05rem; margin-bottom: 2mm; }
    .grid.two .secret { padding-top: 2mm; font-size: 0.9rem; }
    .grid.two .digit { font-size: 2.5rem; margin-top: 2mm; line-height: 1; }
    section > h2 { font: 600 0.9rem sans-serif; color: #777; border-bottom: 1px solid #ddd; padding-bottom: 3px; margin: 0 0 5mm; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; }

    /* Gemeinsame Bausteine im Cover-Stil */
    .cover-title { font-family: var(--title); font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; line-height: 1.05; }
    .caps { font-family: var(--title); font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; font-size: 0.72em; }

    .band {
      position: relative;
      background:
        radial-gradient(circle at 50% 60%, rgba(212, 166, 74, 0.28), transparent 60%),
        radial-gradient(1px 1px at 12% 25%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 82% 18%, #fff 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 70% 70%, #fff 50%, transparent 51%),
        radial-gradient(1px 1px at 25% 75%, #fff 50%, transparent 51%),
        linear-gradient(180deg, #0d1512, var(--forest));
      color: var(--gold);
      text-align: center;
      padding: 4mm 3mm;
    }
    .band .cover-title { color: var(--gold); text-shadow: 0 1px 0 #000, 0 0 8px rgba(212, 166, 74, 0.5); }
    .eyes { display: block; margin: 1mm auto 0; width: 70%; height: auto; }
    .forest { display: block; width: 100%; height: 9mm; }
    .forest path { fill: var(--forest); }

    .card {
      border: 0.6mm solid var(--forest);
      border-radius: 3mm;
      overflow: hidden;
      background: var(--paper);
      text-align: center;
      break-inside: avoid;
      display: flex;
      flex-direction: column;
    }
    .card .body { padding: 3mm 4mm; flex: 1; }
    .card .forest { margin-top: auto; flex-shrink: 0; }

    /* QR-Karten: Code immer schwarz auf weiß */
    .qr { background: #fff; display: inline-block; padding: 1.5mm; border-radius: 1.5mm; }
    .qr svg { width: 42mm; height: 42mm; display: block; }
    /* QR-Karten zum Knicken: zwei Quadrate übereinander, Rückseite auf dem Kopf */
    .folds { display: grid; grid-template-columns: repeat(3, 60mm); gap: 6mm 5mm; justify-content: center; }
    .fold { width: 60mm; border: 0.4mm solid var(--forest); break-inside: avoid; }
    .fold .face { height: 60mm; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .fold .front { background: var(--paper); border-bottom: 0.3mm dashed #999; padding-top: 1mm; }
    .fold .front .qr svg { width: 38mm; height: 38mm; }
    .fold .station-name { margin: 1.5mm 2mm 0; font-family: var(--title); font-weight: 800; font-size: 0.85rem; letter-spacing: 0.04em; color: var(--forest); line-height: 1.15; }
    /* Spurcode nur als Notlösung, falls die Kamera streikt */
    .fold .front .spurcode { margin: 0.8mm 0 0; font-size: 0.62rem; color: #888; }
    .fold .back { background: linear-gradient(0deg, #0d1512, var(--forest)); justify-content: space-between; }
    .fold .back .band { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: center; padding: 3mm; background: radial-gradient(circle at 50% 40%, rgba(212, 166, 74, 0.28), transparent 60%); }
    .fold .back .cover-title { font-size: 1.05rem; letter-spacing: 0.1em; }
    .fold .back .eyes { width: 80%; margin-bottom: 3mm; }
    .fold .back .forest { height: 9mm; }
    .fold .back .forest path { fill: #0d1512; }
    .fold .back .back-num { font-family: var(--title); font-weight: 800; font-size: 1.7rem; line-height: 1; color: var(--gold); text-shadow: 0 1px 0 #000, 0 0 8px rgba(212, 166, 74, 0.5); margin-top: 2mm; }
    body.eco .fold .back .back-num { color: var(--forest); text-shadow: none; }
    .upside-down { transform: rotate(180deg); }
    body.eco .fold .back { background: #fff; }
    body.eco .fold .back .band { border-bottom: 0; }
    body.eco .fold .back .forest path { fill: #c9d3c2; }
    .spurcode { font-family: var(--title); font-weight: 600; letter-spacing: 0.2em; margin: 2mm 0 0; }

    /* Rollenkarten */
    .symbol { font-size: 2.6rem; line-height: 1.1; margin-top: 1mm; }
    .apprentice { font-family: var(--title); font-weight: 800; font-size: 1.15rem; margin: 1mm 0 0; letter-spacing: 0.06em; }
    .role-title { margin: 0.5mm 0 2mm; color: var(--gold-ink); }
    .role-text { font-style: italic; font-size: 0.95rem; margin: 0 0 2mm; }
    .secret { border-top: 1px solid var(--line); padding-top: 2mm; font-size: 0.8rem; }
    .digit { font-family: var(--title); font-weight: 800; font-size: 2.4rem; color: var(--gold-ink); line-height: 1.1; }

    /* Beutekarten */
    .letter { font-family: var(--title); font-weight: 800; font-size: 4.2rem; color: var(--gold-ink); line-height: 1; margin: 2mm 0; }

    /* Aushänge (Pfotenschrift, Kräuter): ganze A4-Seite, hell */
    .sheet {
      border: 0.8mm solid var(--forest);
      outline: 0.3mm solid var(--gold);
      outline-offset: -3mm;
      border-radius: 3mm;
      background: #fff;
      min-height: 265mm;
      break-inside: avoid;
      padding: 12mm 12mm 10mm;
      display: flex;
      flex-direction: column;
    }
    .sheet-head { text-align: center; color: var(--gold-ink); }
    .sheet-head .cover-title { font-size: 2.6rem; color: var(--forest); margin-top: 1mm; }
    .divider { display: flex; align-items: center; gap: 4mm; margin: 4mm 25mm 0; font-size: 1.2rem; }
    .divider::before, .divider::after { content: ""; flex: 1; border-top: 0.4mm solid var(--gold); }
    .sheet .lead { text-align: center; font-style: italic; margin: 5mm 0 6mm; font-size: 1.25rem; }
    .pawgrid { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 1fr; gap: 3.5mm; }
    .pawgrid div { border: 0.4mm solid var(--line); border-radius: 2.5mm; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pawgrid span { font-size: 3rem; line-height: 1.15; }
    .pawgrid b { font-family: var(--title); font-size: 1.9rem; line-height: 1.1; }
    .herbs { flex: 1; list-style: none; padding: 0; margin: 8mm 0 0; display: flex; flex-direction: column; justify-content: space-evenly; }
    .herbs li { padding: 6mm 4mm; border-bottom: 0.3mm dashed var(--line); text-align: center; }
    .herbs li:last-child { border-bottom: 0; }
    .herbs b { display: block; font-family: var(--title); font-weight: 800; font-size: 1.9rem; letter-spacing: 0.06em; color: var(--forest); }
    .herbs span { display: block; font-size: 1.5rem; font-style: italic; margin-top: 1mm; }

    /* Beutekarten quadratisch */
    .card.square { aspect-ratio: 1; }
    .card.square .band { padding: 2.5mm 3mm; }
    .card.square .body { padding: 1mm 3mm 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card.square .symbol { font-size: 2.6rem; margin: 0; }
    .card.square .letter { font-size: 4.2rem; margin: 0; }
    /* Beute als Foto (keine Emojis – sonst Verwechslung mit der Pfotenschrift) */
    .prey-photo { width: 30mm; height: 30mm; object-fit: cover; border-radius: 2mm; border: 0.5mm solid var(--gold); display: block; }
    .fold .front.prey { justify-content: space-between; padding-top: 0; }
    .fold .front.prey .band { width: 100%; padding: 2mm 3mm; }
    .fold .front.prey .body { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4mm; }
    .fold .front.prey .letter { font-size: 3.6rem; margin: 0; }
    .card.square .forest { height: 7mm; }

    /* Urkunden als Fotos 15 × 10 cm */
    .photos { display: grid; gap: 6mm; justify-content: center; }
    .photo { margin: 0; break-inside: avoid; text-align: center; }
    .photo img { width: 150mm; height: 100mm; display: block; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
    .photo-wait { width: 150mm; height: 100mm; display: grid; place-items: center; border: 1px dashed var(--line); font-family: sans-serif; color: #888; }
    .photo .download { display: inline-block; margin-top: 2mm; font-family: sans-serif; font-size: 0.85rem; color: var(--forest); }
    .screen-only-inline { font-family: sans-serif; font-size: 0.9rem; background: #fff6dc; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
    .screen-only-inline button { margin-left: 8px; font: inherit; font-weight: 600; padding: 4px 12px; cursor: pointer; }

    /* Spielleitung */
    .gm td, .gm th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; font-family: sans-serif; font-size: 0.82rem; }
    .gm { border-collapse: collapse; width: 100%; }
    h1 { font-family: var(--title); font-size: 1.3rem; }

    /* Tinte sparen: keine dunklen Flächen */
    body.eco .band { background: #fff; color: var(--gold-ink); border-bottom: 0.6mm solid var(--forest); }
    body.eco .band .cover-title { color: var(--forest); text-shadow: none; }
    body.eco .forest path { fill: #c9d3c2; }
    body.eco .card { background: #fff; }
    body.eco .pawgrid div { background: #fff; }

    /* Vorrat der Heilerin: halbe A4-Seite */
    .sheet.half { min-height: 0; height: 132mm; padding: 8mm 10mm 6mm; }
    .sheet.half .sheet-head .cover-title { font-size: 1.8rem; }
    .sheet.half .divider { margin-top: 2mm; }
    .sheet.half .herbs { margin-top: 3mm; }
    .sheet.half .herbs li { padding: 2mm 3mm; }
    .sheet.half .herbs b { font-size: 1.3rem; }
    .sheet.half .herbs span { font-size: 1.1rem; margin-top: 0; }

    @media print {
      section > h2 { display: none; }
      .screen-only, .screen-only-inline, .photo .download { display: none; }
      body { padding: 0; }
      @page { size: A4; margin: 10mm; }
      /* Rollenkarten im Querformat: 2 × 2 breite Karten (12,6 × 8,8 cm) pro Seite */
      @page rollen { size: A4 landscape; margin: 10mm; }
      #rollenkarten { page: rollen; }
      .grid.two { grid-template-columns: repeat(2, 126mm); justify-content: center; gap: 6mm 8mm; }
      .grid.two .card { height: 88mm; }
      /* weicher Leuchtschatten wird im PDF zum Kasten */
      .band .cover-title { text-shadow: 0 1px 0 #000; }
    }
  </style>
</head>
<body>
  <div class="screen-only">
    <span><b>Druckvorlagen.</b> Die QR-Codes zeigen auf <code id="base"></code> – von der <b>veröffentlichten</b> Adresse aus drucken. QR- und Beutekarten laminieren oder in Klarsichthüllen (Dezember = nass).</span>
    <label><input type="checkbox" id="eco"> Tinte sparen (helle Kopfleisten)</label>
  </div>
  <div id="out"></div>
  <script src="js/lib/qrcode.js"></script>
  <script type="module" src="js/print.js"></script>
</body>
</html>
